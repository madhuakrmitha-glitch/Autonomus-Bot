openapi: 3.1.0
info:
  title: Open Model Computer Assistant API
  description: Proposed controller and worker adapter API. Not the public API of OpenClaw.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /tasks:
    post:
      tags:
      - tasks
      summary: Create a durable task for the authenticated owner
      operationId: create_task_tasks_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - tasks
      summary: List Tasks
      operationId: list_tasks_tasks_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskView'
                title: Response List Tasks Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}:
    get:
      tags:
      - tasks
      summary: Retrieve status, artifacts and blocking reason
      operationId: get_task_tasks__task_id__get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/cancel:
    post:
      tags:
      - tasks
      summary: Stop future work and reconcile in-flight actions
      operationId: cancel_task_tasks__task_id__cancel_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/pause:
    post:
      tags:
      - tasks
      summary: Pause Task
      operationId: pause_task_tasks__task_id__pause_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/resume:
    post:
      tags:
      - tasks
      summary: Resume Task
      operationId: resume_task_tasks__task_id__resume_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
              default: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/steer:
    post:
      tags:
      - tasks
      summary: Steer Task
      operationId: steer_task_tasks__task_id__steer_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/answer:
    post:
      tags:
      - tasks
      summary: Answer Task
      operationId: answer_task_tasks__task_id__answer_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /artifacts/{artifact_id}:
    get:
      tags:
      - tasks
      summary: Get Artifact
      operationId: get_artifact_artifacts__artifact_id__get
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          title: Artifact Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approvals/{approval_id}:
    get:
      tags:
      - approvals
      summary: Get Approval
      operationId: get_approval_approvals__approval_id__get
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approvals/{approval_id}/decisions:
    post:
      tags:
      - approvals
      summary: Submit an authenticated action-bound decision
      operationId: decide_approvals__approval_id__decisions_post
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Decide Approvals  Approval Id  Decisions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /budget:
    get:
      tags:
      - budget
      summary: Inspect period, reservations, actual usage and remaining capacity
      operationId: budget_budget_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /schedules:
    get:
      tags:
      - schedules
      summary: Schedules
      operationId: schedules_schedules_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Schedules Schedules Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /schedules/{schedule_id}/fire:
    post:
      tags:
      - schedules
      summary: Trigger a schedule (deduplicated by planned time; for OpenClaw automations)
      operationId: fire_schedules__schedule_id__fire_post
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
          title: Schedule Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireRequest'
              default: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fire Schedules  Schedule Id  Fire Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/register:
    post:
      tags:
      - workers
      summary: Register a worker and capability set
      operationId: register_workers_register_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistration'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Register Workers Register Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/heartbeat:
    post:
      tags:
      - workers
      summary: Heartbeat
      operationId: heartbeat_workers__worker_id__heartbeat_post
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeat'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Heartbeat Workers  Worker Id  Heartbeat Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/jobs:
    post:
      tags:
      - workers
      summary: Dispatch the next fenced bounded job to this worker (long poll; 204
        when idle)
      operationId: jobs_workers__worker_id__jobs_post
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/receipts:
    post:
      tags:
      - workers
      summary: Submit durable execution results
      operationId: receipts_workers__worker_id__receipts_post
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      - name: x-omca-session-epoch
        in: header
        required: true
        schema:
          type: string
          title: X-Omca-Session-Epoch
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionReceipt'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Receipts Workers  Worker Id  Receipts Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/artifacts:
    post:
      tags:
      - workers
      summary: Upload a declared job output
      operationId: upload_workers__worker_id__artifacts_post
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_workers__worker_id__artifacts_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Upload Workers  Worker Id  Artifacts Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/jobs/{job_id}/inputs/{artifact_id}:
    get:
      tags:
      - workers
      summary: Job Input
      operationId: job_input_workers__worker_id__jobs__job_id__inputs__artifact_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          title: Artifact Id
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /bridge/openclaw/message:
    post:
      tags:
      - bridge
      summary: Owner message forwarded by the OpenClaw plugin with its verified sender
        id
      operationId: bridge_message_bridge_openclaw_message_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeMessage'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Bridge Message Bridge Openclaw Message Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /bridge/openclaw/callback:
    post:
      tags:
      - bridge
      summary: Inline-button callback (namespace omca) forwarded by the OpenClaw plugin
      operationId: bridge_callback_bridge_openclaw_callback_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeCallback'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Bridge Callback Bridge Openclaw Callback Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models:
    get:
      tags:
      - model-gateway
      summary: Models
      operationId: models_v1_models_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Models V1 Models Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/completions:
    post:
      tags:
      - model-gateway
      summary: OpenAI-compatible, allowlisted and metered chat completions for framework-owned
        calls
      operationId: chat_v1_chat_completions_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActionReceipt:
      properties:
        action_id:
          type: string
          title: Action Id
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id
        worker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Id
        fencing_token:
          anyOf:
          - type: integer
          - type: 'null'
          title: Fencing Token
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        started_at:
          type: string
          title: Started At
        finished_at:
          type: string
          title: Finished At
        result:
          additionalProperties: true
          type: object
          title: Result
        observation:
          anyOf:
          - $ref: '#/components/schemas/Observation'
          - type: 'null'
        artifact_ids:
          items:
            type: string
          type: array
          title: Artifact Ids
        verification:
          additionalProperties: true
          type: object
          title: Verification
        error:
          anyOf:
          - $ref: '#/components/schemas/ReceiptError'
          - type: 'null'
        component_versions:
          additionalProperties:
            type: string
          type: object
          title: Component Versions
      additionalProperties: false
      type: object
      required:
      - action_id
      - status
      - started_at
      - finished_at
      title: ActionReceipt
    ApprovalDecision:
      properties:
        decision:
          type: string
          enum:
          - approve
          - deny
          title: Decision
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - decision
      title: ApprovalDecision
    ApprovalRequest:
      properties:
        approval_id:
          type: string
          title: Approval Id
        task_id:
          type: string
          title: Task Id
        action_id:
          type: string
          title: Action Id
        owner:
          type: string
          title: Owner
        operation:
          type: string
          title: Operation
        action_digest:
          type: string
          title: Action Digest
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
        consequence:
          type: string
          title: Consequence
        preview:
          type: string
          title: Preview
        preconditions:
          additionalProperties: true
          type: object
          title: Preconditions
        policy_version:
          type: string
          title: Policy Version
        expires_at:
          type: string
          title: Expires At
        status:
          $ref: '#/components/schemas/ApprovalStatus'
          default: PENDING
      additionalProperties: false
      type: object
      required:
      - approval_id
      - task_id
      - action_id
      - owner
      - operation
      - action_digest
      - destination
      - consequence
      - preview
      - policy_version
      - expires_at
      title: ApprovalRequest
    ApprovalStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CONSUMED
      - INVALIDATED
      title: ApprovalStatus
    ArtifactManifest:
      properties:
        artifact_id:
          type: string
          title: Artifact Id
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        name:
          type: string
          title: Name
        rel_path:
          type: string
          title: Rel Path
          description: Path relative to the workspace root
        media_type:
          type: string
          title: Media Type
        bytes:
          type: integer
          title: Bytes
        sha256:
          type: string
          title: Sha256
        kind:
          type: string
          title: Kind
          description: report, evidence, observation, media, input, transfer
        parent_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Artifact Id
        crop:
          anyOf:
          - $ref: '#/components/schemas/Rect'
          - type: 'null'
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
        resize_scale:
          anyOf:
          - type: number
          - type: 'null'
          title: Resize Scale
        source_map:
          additionalProperties: true
          type: object
          title: Source Map
        validation:
          additionalProperties: true
          type: object
          title: Validation
        created_at:
          type: string
